  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

nt (WTP) Stage 2 automation upgrade. It describes how the plant is to behave — the control loops, sequences, modes, interlocks, alarms, and operator interface — in enough detail for Central Highlands Water to approve the design before software configuration begins.<\u002Fp>\n  <p style=\"font-size:14.5px;line-height:1.65;max-width:64ch\">This document is the controlling reference for Factory Acceptance Testing (FAT) and Site Acceptance Testing (SAT). Where the delivered system and this specification disagree, this specification prevails until formally amended by revision.<\u002Fp>\n\n  <h3 style=\"font-size:16px;font-weight:600;margin:24px 0 10px\">2.2&nbsp;&nbsp;Scope of supply<\u002Fh3>\n  <p style=\"font-size:14.5px;line-height:1.65;max-width:64ch\">Pac Technologies is engaged to design, configure, test, and commission the control system for the following process areas:<\u002Fp>\n  <ul style=\"font-size:14.5px;line-height:1.7;max-width:64ch;color:#3A434E;padding-left:22px;margin:0 0 12px\">\n    <li>Raw water inlet works and flow balancing (Area 100)<\u002Fli>\n    <li>Dissolved Air Flotation (DAF) clarification, two streams (Area 200)<\u002Fli>\n    <li>Dual-media gravity filtration, four cells, with automatic backwash (Area 300)<\u002Fli>\n    <li>Chlorine disinfection and contact tank residual control (Area 400)<\u002Fli>\n    <li>High-lift pumping to the Darley reservoir, three variable-speed duties (Area 500)<\u002Fli>\n  <\u002Ful>\n  <p style=\"font-size:14.5px;line-height:1.65;max-width:64ch\">The upgrade replaces an obsolete Modicon Quantum PLC and a standalone Citect node with a Siemens S7-1500 controller, ET 200SP remote I/O, and a redundant WinCC Unified SCADA server pair. Field instrumentation, motor control centres, and network cabling are provided under separate packages and are interfaced to, not supplied by, this scope.<\u002Fp>\n\n  <h3 style=\"font-size:16px;font-weight:600;margin:24px 0 10px\">2.3&nbsp;&nbsp;Exclusions<\u002Fh3>\n  <p style=\"font-size:14.5px;line-height:1.65;max-width:64ch\">The following are explicitly outside this scope: process design and hydraulic sizing; supply or modification of field instruments and final control elements; electrical installation and MCC works; civil and structural works; and telemetry to the corporate historian beyond the OPC UA hand-off point defined in Section 10.<\u002Fp>\n\n  <!-- 3 References -->\n  <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#3050A0;margin:44px 0 6px\">Section 3<\u002Fdiv>\n  <h2 style=\"font-size:24px;font-weight:600;border-bottom:2px solid #3050A0;padding-bottom:10px;margin-bottom:20px\">3&nbsp;&nbsp;Reference documents &amp; standards<\u002Fh2>\n\n  <h3 style=\"font-size:16px;font-weight:600;margin:20px 0 10px\">3.1&nbsp;&nbsp;Project documents<\u002Fh3>\n  <sc-raw-table style=\"width:100%;font-size:12px\">\n    <sc-raw-thead><sc-raw-tr style=\"background:#E5EBF6\">\n      <sc-raw-th style=\"text-align:left;padding:9px 12px;color:#1F3878;font-weight:600;border:1px solid #D9DEE5;width:150px\">Reference<\u002Fsc-raw-th>\n      <sc-raw-th style=\"text-align:left;padding:9px 12px;color:#1F3878;font-weight:600;border:1px solid #D9DEE5\">Title<\u002Fsc-raw-th>\n      <sc-raw-th style=\"text-align:left;padding:9px 12px;color:#1F3878;font-weight:600;border:1px solid #D9DEE5;width:60px\">Rev<\u002Fsc-raw-th>\n    <\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n    <sc-raw-tbody>\n      <sc-raw-tr class=\"fds-row\"><sc-raw-td style=\"padding:8px 12px;border:1px solid #E8EBF0;font-family:'JetBrains Mono',monospace\">CHW-BM-PID-100<\u002Fsc-raw-td><sc-raw-td style=\"padding:8px 12px;border:1px solid #E8EBF0\">P&amp;ID — Inlet works and flow balancing<\u002Fsc-raw-td><sc-raw-td style=\"padding:8px 12px;border:1px solid #E8EBF0;font-family:'JetBrains Mono',monospace\">4<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr class=\"fds-row\"><sc-raw-td style=\"padding:8px atic sequences, and SCADA manual commands. Local control at the field or MCC always has highest priority and cannot be overridden from SCADA.<\u002Fp>\n\n  <h3 style=\"font-size:16px;font-weight:600;margin:24px 0 10px\">5.2&nbsp;&nbsp;Device modes<\u002Fh3>\n  <sc-raw-table style=\"width:100%;font-size:12px\">\n    <sc-raw-thead><sc-raw-tr style=\"background:#E5EBF6\">\n      <sc-raw-th style=\"text-align:left;padding:9px 12px;color:#1F3878;font-weight:600;border:1px solid #D9DEE5;width:110px\">Mode<\u002Fsc-raw-th>\n      <sc-raw-th style=\"text-align:left;padding:9px 12px;color:#1F3878;font-weight:600;border:1px solid #D9DEE5\">Behaviour<\u002Fsc-raw-th>\n      <sc-raw-th style=\"text-align:left;padding:9px 12px;color:#1F3878;font-weight:600;border:1px solid #D9DEE5;width:130px\">Command source<\u002Fsc-raw-th>\n    <\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n    <sc-raw-tbody>\n      <sc-raw-tr class=\"fds-row\"><sc-raw-td style=\"padding:8px 12px;border:1px solid #E8EBF0;font-weight:600\">Local<\u002Fsc-raw-td><sc-raw-td style=\"padding:8px 12px;border:1px solid #E8EBF0\">Device operated from field / MCC local station. SCADA monitors only.<\u002Fsc-raw-td><sc-raw-td style=\"padding:8px 12px;border:1px solid #E8EBF0\">Hardwired<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr class=\"fds-row\"><sc-raw-td style=\"padding:8px 12px;border:1px solid #E8EBF0;font-weight:600\">Auto<\u002Fsc-raw-td><sc-raw-td style=\"padding:8px 12px;border:1px solid #E8EBF0\">Device follows PLC sequence and loop control. Normal running mode.<\u002Fsc-raw-td><sc-raw-td style=\"padding:8px 12px;border:1px solid #E8EBF0\">PLC sequence<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr class=\"fds-row\"><sc-raw-td style=\"padding:8px 12px;border:1px solid #E8EBF0;font-weight:600\">Manual<\u002Fsc-raw-td><sc-raw-td style=\"padding:8px 12px;border:1px solid #E8EBF0\">Operator starts/stops or sets output from SCADA. Interlocks remain active.<\u002Fsc-raw-td><sc-raw-td style=\"padding:8px 12px;     <sc-raw-tr class=\"fds-row\"><sc-raw-td style=\"padding:6px 10px;border:1px solid #E8EBF0;font-family:'JetBrains Mono',monospace\">FCV_4102<\u002Fsc-raw-td><sc-raw-td style=\"padding:6px 10px;border:1px solid #E8EBF0\">Chlorine dosing control valve<\u002Fsc-raw-td><sc-raw-td style=\"padding:6px 10px;border:1px solid #E8EBF0\">AO<\u002Fsc-raw-td><sc-raw-td style=\"padding:6px 10px;border:1px solid #E8EBF0\">0–100 %<\u002Fsc-raw-td><sc-raw-td style=\"padding:6px 10px;border:1px solid #E8EBF0;font-family:'JetBrains Mono',monospace\">%QW600<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr class=\"fds-row\"><sc-raw-td style=\"padding:6px 10px;border:1px solid #E8EBF0;font-family:'JetBrains Mono',monospace\">LIT_5001<\u002Fsc-raw-td><sc-raw-td style=\"padding:6px 10px;border:1px solid #E8EBF0\">Darley reservoir level<\u002Fsc-raw-td><sc-raw-td style=\"padding:6px 10px;border:1px solid #E8EBF0\">AI<\u002Fsc-raw-td><sc-raw-td style=\"padding:6px 10px;border:1px solid #E8EBF0\">0–12 m<\u002Fsc-raw-td><sc-raw-td style=\"padding:6px 10px;border:1px solid #E8EBF0;font-family:'JetBrains Mono',monospace\">%IW590<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr class=\"fds-row\"><sc-raw-td style=\"padding:6px 10px;border:1px solid #E8EBF0;font-family:'JetBrains Mono',monospace\">SIC_5101<\u002Fsc-raw-td><sc-raw-td style=\"padding:6px 10px;border:1px solid #E8EBF0\">High-lift pump 1 speed reference<\u002Fsc-raw-td><sc-raw-td style=\"padding:6px 10px;border:1px solid #E8EBF0\">AO<\u002Fsc-raw-td><sc-raw-td style=\"padding:6px 10px;border:1px solid #E8EBF0\">0–100 %<\u002Fsc-raw-td><sc-raw-td style=\"padding:6px 10px;border:1px solid #E8EBF0;font-family:'JetBrains Mono',monospace\">%QW610<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr class=\"fds-row\"><sc-raw-td style=\"padding:6px 10px;border:1px solid #E8EBF0;font-family:'JetBrains Mono',monospace\">XS_5101R<\u002Fsc-raw-td><sc-raw-td style=\"padding:6px 10px;border:1px solid #E8EBF0\">High-lift pump 1 running feedback<\u002Fsc-raw-td><sc-raw-td style=\"padding:6px 10px;border:1px solid #E8EBF0\">DI<\u002Fsc-raw-td><sc-raw-td style=\"padding:6px 10px;border:1px solid #E8EBF0\">0/1<\u002Fsc-raw-td><sc-raw-td style=\"padding:6px 10px;border:1px solid #E8EBF0;font-family:'JetBrains Mono',monospace\">%I20.0<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr class=\"fds-row\"><sc-raw-td style=\"padding:6px 10px;border:1px solid #E8EBF0;font-family:'JetBrains Mono',monospace\">XV_3101<\u002Fsc-raw-td><sc-raw-td style=\"padding:6px 10px;border:1px solid #E8EBF0\">Filter cell 1 inlet penstock command<\u002Fsc-raw-td><sc-raw-td style=\"padding:6px 10px;border:1px solid #E8EBF0\">DO<\u002Fsc-raw-td><sc-raw-td style=\"padding:6px 10px;border:1px solid #E8EBF0\">0/1<\u002Fsc-raw-td><sc-raw-td style=\"padding:6px 10px;border:1px solid #E8EBF0;font-family:'JetBrains Mono',monospace\">%Q12.0<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr class=\"fds-row\"><sc-raw-td style=\"padding:6px 10px;border:1px solid #E8EBF0;font-family:'JetBrains Mono',monospace\">XS_3101O<\u002Fsc-raw-td><sc-raw-td style=\"padding:6px 10px;border:1px solid #E8EBF0\">Filter cell 1 penstock open limit<\u002Fsc-raw-td><sc-raw-td style=\"padding:6px 10px;border:1px solid #E8EBF0\">DI<\u002Fsc-raw-td><sc-raw-td style=\"padding:6px 10px;border:1px solid #E8EBF0\">0/1<\u002Fsc-raw-td><sc-raw-td style=\"padding:6px 10px;border:1px solid #E8EBF0;font-family:'JetBrains Mono',monospace\">%I12.0<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n    <\u002Fsc-raw-tbody>\n  <\u002Fsc-raw-table>\n\n  <div class=\"fds-note\" style=\"margin-top:16px;background:#F4F6FA;border:1px solid #D9DEE5;border-radius:8px;padding:14px 18px;font-size:12px;line-height:1.6;color:#3A434E\">\n    <strong style=\"color:#1F3878\">I/O count summary.<\u002Fstrong> The full schedule comprises 412 physical points: 96 AI, 24 AO, 214 DI, 78 DO, distributed across three ET 200SP stations. A 15 % spare-capacity margin is provisioned in each rack per the corporate SCADA standard.\n  <\u002Fdiv>\n\n  <!-- 7 Functional descriptions -->\n  <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#3050A0;margin:44px 0 6px\">Section 7<\u002Fdiv>\n  <h2 style=\"font-size:24px;font-weight:600;border-bottom:2px solid #3050A0;padding-bottom:10px;margin-bottom:20px\">7&nbsp;&nbsp;Functional descriptions<\u002Fh2>\n\n  <h3 style=\"font-size:16px;font-weight:600;margin:20px 0 10px\">7.1&nbsp;&nbsp;Inlet flow control (Area 100)<\u002Fh3>\n  <p style=\"font-size:14.5px;line-height:1.65;max-width:64ch\">Raw water is drawn to the balance tank and paced to match plant demand. The inlet control valve modulates on a PID loop to hold balance-tank level <span style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px\">LIT_1002<\u002Fspan> at its setpoint (default 3.2 m). Inlet flow <span style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px\">FIT_1001<\u002Fspan> is rate-limited to protect downstream DAF hydraulics; the ramp rate is a configurable parameter (default 5 L/s per minute).<\u002Fp>\n\n  <h3 style=\"font-size:16px;font-weight:600;margin:24px 0 10px\">7.2&nbsp;&nbsp;Chlorine residual control (Area 400)<\u002Fh3>\n  <p style=\"font-size:14.5px;line-height:1.65;max-width:64ch\">Disinfection uses flow-paced trim control. A feed-forward term sets base dose from treated flow; a PID trim on measured residual <span style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px\">AIT_4101<\u002Fspan> corrects to the target setpoint (default 0.9 mg/L, operator-adjustable 0.5–1.5 mg/L). The dosing valve <span style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px\">FCV_4102<\u002Fspan> is driven only while treated flow is confirmed; on loss of flow the loop holds last output and alarms. The design maintains disinfection consistent with the Australian Drinking Water Guidelines.<\u002Fp>\n\n  <h3 style=\"font-size:16px;font-weight:600;margin:24px 0 10px\">7.3&nbsp;&nbsp;Filter backwash sequence (Area 300)<\u002Fh3>\n  <p style=\"font-size:14.5px;line-height:1.65;max-width:64ch\">A filter cell is called for backwash on the first of three triggers: differential headloss <span style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px\">PDT_31xx<\u002Fspan> above 2.4 m, filtered turbidity breakthrough above 0.30 NTU, or elapsed run time above 96 h. Only one cell backwashes at a time; the remaining cells absorb the flow. The sequence is step-driven and each step must confirm before the next begins:<\u002Fp>\n  <ol style=\"font-size:14px;line-height:1.7;max-width:62ch;color:#3A434E;padding-left:22px;margin:0 0 12px\">\n    <li>Close cell inlet penstock, allow level to draw down to the wash weir.<\u002Fli>\n    <li>Confirm isolation; open air-scour valve, run scour blower 3 min.<\u002Fli>\n    <li>Stop scour; ramp backwash pump to wash rate over 30 s.<\u002Fli>\n    <li>Wash 8 min or until wash-water turbidity below 12 NTU.<\u002Fli>\n    <li>Ramp down, settle 2 min, reopen inlet, return cell to service filter-to-waste for 5 min.<\u002Fli>\n  <\u002Fol>\n  <p style=\"font-size:14.5px;line-height:1.65;max-width:64ch\">Any step that fails to confirm within its watchdog time aborts the sequence, returns the cell to a safe isolated state, and raises a sequence-fault alarm. A backwash in progress inhibits a second cell being called until the active wash completes.<\u002Fp>\n\n  <h3 style=\"font-size:16px;font-weight:600;margin:24px 0 10px\">7.4&nbsp;&nbsp;High-lift pumping (Area 500)<\u002Fh3>\n  <p style=\"font-size:14.5px;line-height:1.65;max-width:64ch\">Three variable-speed pumps deliver to the Darley reservoir in a duty / assist / standby configuration. A common PID loop on reservoir level <span style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px\">LIT_5001<\u002Fspan> sets a shared speed reference; pumps stage in as demand rises and stage out as it falls, with anti-cycling dead-bands. Duty rotation is by accumulated run hours to equalise wear; rotation occurs on each stop, never on a running changeover. A pump reporting a fault is skipped and the next available pump assumes its role.<\u002Fp>\n\n  <!-- 8 Alarms & interlocks -->\n  <div style=\"break-before:page\"><\u002Fdiv>\n  <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#3050A0;margin:0 0 6px\">Section 8<\u002Fdiv>\n  <h2 style=\"font-size:24px;font-weight:600;border-bottom:2px solid #3050A0;padding-bottom:10px;margin-bottom:20px\">8&nbsp;&nbsp;Alarms &amp; interlocks<\u002Fh2>\n\n  <h3 style=\"font-size:16px;font-weight:600;margin:20px 0 10px\">8.1&nbsp;&nbsp;Alarm philosophy<\u002Fh3>\n  <p style=\"font-size:14.5px;line-height:1.65;max-width:64ch\">Alarms are managed per ISA-18.2. Every alarm is actionable, has a defined operator response, and is rationalised against a documented consequence. Alarms are prioritised into three classes. Priority is presented by colour and sort order on the SCADA alarm banner; the signal colours are reserved for state and are never used decoratively.<\u002Fp>\n\n  <div style=\"display:flex;gap:12px;flex-wrap:wrap;margin:16px 0\">\n    <div class=\"fds-note\" style=\"flex:1;min-width:150px;border:1px solid #E8EBF0;border-radius:8px;overflow:hidden\">\n      <div style=\"background:#B83227;color:#FFFFFF;padding:8px 12px;font-size:12px;font-weight:600\">High — critical<\u002Fdiv>\n      <div style=\"padding:10px 12px;font-size:12px;line-height:1.55;color:#3A434E\">Immediate action; risk to compliance, safety, or asset. Response &lt; 5 min.<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"fds-note\" style=\"flex:1;min-width:150px;border:1px solid #E8EBF0;border-radius:8px;overflow:hidden\">\n      <div style=\"background:#C7821B;color:#FFFFFF;padding:8px 12px;font-size:12px;font-weight:600\">Medium — warning<\u002Fdiv>\n      <div style=\"padding:10px 12px;font-size:12px;line-height:1.55;color:#3A434E\">Action this shift; process drifting from target. Response &lt; 30 min.<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"fds-note\" style=\"flex:1;min-width:150px;border:1px solid #E8EBF0;border-radius:8px;overflow:hidden\">\n      <div style=\"background:#1F8A4C;color:#FFFFFF;padding:8px 12px;font-size:12px;font-weight:600\">Low — advisory<\u002Fdiv>\n      <div style=\"padding:10px 12px;font-size:12px;line-height:1.55;color:#3A434E\">Awareness only; log and review. No immediate response required.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <h3 style=\"font-size:16px;font-weight:600;margin:24px 0 10px\">8.2&nbsp;&nbsp;Alarm schedule (extract)<\u002Fh3>\n  <sc-raw-table style=\"width:100%;font-size:11.5px\">\n    <sc-raw-thead><sc-raw-tr style=\"background:#E5EBF6\">\n      <sc-raw-th style=\"text-align:left;padding:8px 10px;color:#1F3878;font-weight:600;border:1px solid #D9DEE5;width:90px\">Tag<\u002Fsc-raw-th>\n      <sc-raw-th style=\"text-align:left;padding:8px 10px;color:#1F3878;font-weight:600;border:1px solid #D9DEE5\">Alarm<\u002Fsc-raw-th>\n      <sc-raw-th style=\"text-align:left;padding:8px 10px;color:#1F3878;font-weight:600;border:1px solid #D9DEE5;width:80px\">Setpoint<\u002Fsc-raw-th>\n      <sc-raw-th style=\"text-align:left;padding:8px 10px;color:#1F3878;font-weight:600;border:1px solid #D9DEE5;width:70px\">Priority<\u002Fsc-raw-th>\n    <\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n    <sc-raw-tbody>\n      <sc-raw-tr class=\"fds-row\"><sc-raw-td style=\"padding:6px 10px;border:1px solid #E8EBF0;font-family:'JetBrains Mono',monospace\">AIT_3110<\u002Fsc-raw-td><sc-raw-td style=\"padding:6px 10px;border:1px solid #E8EBF0\">Filtered turbidity high-high<\u002Fsc-raw-td><sc-raw-td style=\"padding:6px 10px;border:1px solid #E8EBF0;font-family:'JetBrains Mono',monospace\">&gt; 0.50 NTU<\u002Fsc-raw-td><sc-raw-td style=\"padding:6px 10px;border:1px solid #E8EBF0;color:#B83227;font-weight:600\">High<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr cla ht:600;border-bottom:2px solid #3050A0;padding-bottom:10px;margin-bottom:20px\">11&nbsp;&nbsp;Security &amp; access levels<\u002Fh2>\n  <p style=\"font-size:14.5px;line-height:1.65;max-width:64ch\">The system is designed to IEC 62443 principles. The control network sits in its own zone behind the plant firewall; no direct routing exists between the control zone and the corporate network except the audited OPC UA conduit. SCADA access is role-based, authenticated against the plant directory, and every setpoint or mode change is logged with user, timestamp, old value, and new value.<\u002Fp>\n  <sc-raw-table style=\"width:100%;font-size:12px\">\n    <sc-raw-thead><sc-raw-tr style=\"background:#E5EBF6\">\n      <sc-raw-th style=\"text-align:left;padding:9px 12px;color:#1F3878;font-weight:600;border:1px solid #D9DEE5;width:120px\">Role<\u002Fsc-raw-th>\n      <sc-raw-th style=\"text-align:left;padding:9px 12px;color:#1F3878;font-weight:600;border:1px solid #D9DEE5\">Permissions<\u002Fsc-raw-th>\n    <\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n    <sc-raw-tbody>\n      <sc-raw-tr class=\"fds-row\"><sc-raw-td style=\"padding:8px 12px;border:1px solid #E8EBF0;font-weight:600\">Viewer<\u002Fsc-raw-td><sc-raw-td style=\"padding:8px 12px;border:1px solid #E8EBF0\">Read-only. View all screens, trends, and alarms. No control.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr class=\"fds-row\"><sc-raw-td style=\"padding:8px 12px;border:1px solid #E8EBF0;font-weight:600\">Operator<\u002Fsc-raw-td><sc-raw-td style=\"padding:8px 12px;border:1px solid #E8EBF0\">Acknowledge alarms; start/stop in Manual; adjust setpoints within bounded ranges.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr class=\"fds-row\"><sc-raw-td style=\"padding:8px 12px;border:1px solid #E8EBF0;font-weight:600\">Supervisor<\u002Fsc-raw-td><sc-raw-td style=\"padding:8px 12px;border:1px solid #E8EBF0\">Operator rights plus Maintenance mode, interlock bypass with permit, setpoint limit changes.<\u002Fsc-raw-td><\
